name: Regenerate Poetry Lock

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lock:
    if: github.head_ref == 'feature/0.2-interface-runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry 2.1.4
        uses: snok/install-poetry@v1
        with:
          version: "2.1.4"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Regenerate lockfile
        run: |
          poetry lock
          poetry check --lock

      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- poetry.lock; then
            echo "poetry.lock already current"
            exit 0
          fi
          git config user.name "Adebayo Oluwadunsin Iyanuoluwa"
          git config user.email "88881603+oiadebayo@users.noreply.github.com"
          git add poetry.lock
          git commit -m "build: regenerate Poetry lockfile"
          git push origin HEAD:feature/0.2-interface-runtime
