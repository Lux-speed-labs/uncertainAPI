name: Regenerate Phase 2 Poetry Lock

on:
  push:
    branches:
      - phase/2-reuse-runtime-mvp

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/2-reuse-runtime-mvp
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Regenerate and verify lockfile
        run: |
          poetry lock
          poetry check --lock

      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- poetry.lock; then
            echo "poetry.lock already current"
            exit 0
          fi
          git config user.name "Adebayo Oluwadunsin Iyanuoluwa"
          git config user.email "88881603+oiadebayo@users.noreply.github.com"
          git add poetry.lock
          git commit -m "build: regenerate Phase 2 Poetry lockfile"
          git push origin HEAD:phase/2-reuse-runtime-mvp
