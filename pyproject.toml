[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "uncertainAPI"
version = "0.1.3-dev"
description = "A Python package for uncertainAPI"
authors = [
    {name = "Iyanuoluwa Adebayo", email = "adebayo@uncertainapi.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["uncertainAPI", "API", "Python", "AI", "Python Framework"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities"
]
dependencies = [
    "django>=4.2",
    "djangorestframework>=3.14",
    "pydantic>=2.0",
    "click>=8.0",
    "ag2>=0.10.0",
    "nest-asyncio>=1.5.0",
    "loguru>=0.7.0",
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://uncertainapi.com/"
Repository = "https://github.com/Lux-speed-labs/uncertainAPI"

[project.scripts]
uncertainapi = "uncertainAPI.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-django>=4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
playwright = [
    "playwright>=1.40.0",
]
selenium = [
    "selenium>=4.0",
]
requests = [
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
]
openai = [
    "openai>=1.0",
]
anthropic = [
    "anthropic>=0.20.0",
]
litellm = [
    "litellm>=1.0",
]
celery = [
    "celery>=5.3.0",
    "redis>=5.0.0",
]
django-q = [
    # 1.6.0 has invalid overlapping Django markers on PyPI; 1.6.1+ fixes metadata.
    # django-q2 declares Requires-Python: <4; marker avoids capping this package's requires-python.
    'django-q2>=1.6.1; python_version < "4"',
]
background-tasks = [
    "django-background-tasks>=1.2.0",
]
# Flattened union of the extras above — do not use uncertainAPI[...] here; that is a
# self-dependency and breaks poetry lock / pip metadata.
full = [
    "playwright>=1.40.0",
    "selenium>=4.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "openai>=1.0",
    "anthropic>=0.20.0",
    "litellm>=1.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    'django-q2>=1.6.1; python_version < "4"',
    "django-background-tasks>=1.2.0",
]

[tool.poetry]
packages = [{include = "uncertainAPI", from = "."}]
include = [
    { path = "uncertainAPI/py.typed", format = ["sdist", "wheel"] },
    { path = "LICENSE", format = ["sdist", "wheel"] },
    { path = "README.md", format = ["sdist", "wheel"] },
]
exclude = [
    "**/.DS_Store",
    "**/__pycache__",
    "**/*.pyc",
    "**/tests",
]

[tool.pytest.ini_options]
testpaths = ["uncertainAPI/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=uncertainAPI --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ["py312", "py313"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["N999"]  # Ignore invalid module name for package name

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
