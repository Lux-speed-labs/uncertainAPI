[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "uncertainAPI"
version = "0.2.0-dev"
description = "Lightweight, interface-first runtime for executing portable data integration plans"
authors = [
    {name = "Iyanuoluwa Adebayo", email = "adebayo@uncertainapi.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["uncertainAPI", "API", "Python", "data integration", "schema", "runtime"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.urls]
Homepage = "https://uncertainapi.com/"
Repository = "https://github.com/Lux-speed-labs/uncertainAPI"

[project.optional-dependencies]
http = [
    "httpx>=0.25.0,<1.0",
]
mapping = [
    "jmespath>=1.0.1,<2.0",
]
validation = [
    "jsonschema>=4.20,<5.0",
]
runtime = [
    "jmespath>=1.0.1,<2.0",
    "jsonschema>=4.20,<5.0",
]
standard = [
    "httpx>=0.25.0,<1.0",
    "jmespath>=1.0.1,<2.0",
    "jsonschema>=4.20,<5.0",
]
dlt = [
    "dlt>=1.30.0,<2.0",
]
connectors = [
    "dlt>=1.30.0,<2.0",
]
dev = [
    "dlt>=1.30.0,<2.0",
    "httpx>=0.25.0,<1.0",
    "jmespath>=1.0.1,<2.0",
    "jsonschema>=4.20,<5.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[tool.poetry]
packages = [{include = "uncertainAPI", from = "."}]
include = [
    { path = "uncertainAPI/py.typed", format = ["sdist", "wheel"] },
    { path = "LICENSE", format = ["sdist", "wheel"] },
    { path = "README.md", format = ["sdist", "wheel"] },
]
exclude = [
    "**/.DS_Store",
    "**/__pycache__",
    "**/*.pyc",
    "**/tests",
]

[tool.pytest.ini_options]
testpaths = ["uncertainAPI/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=uncertainAPI --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ["py312", "py313"]
include = '\\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = ["N999"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
exclude = [
    "^uncertainAPI/tests/",
]
